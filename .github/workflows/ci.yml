name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared types
        run: cd packages/shared && npm run build

      - name: Type-check API
        run: cd packages/api && npx tsc --noEmit

      - name: Type-check Web
        run: cd packages/web && npx tsc -b --noEmit

      - name: Run API tests
        run: cd packages/api && npm test

      - name: Run Web tests
        run: cd packages/web && npm test

      - name: Build Web
        run: cd packages/web && npm run build

  cdk-synth:
    name: CDK Synth
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared types
        run: cd packages/shared && npm run build

      - name: Build API
        run: cd packages/api && npm run build

      - name: CDK synth (validate templates)
        run: cd packages/infrastructure && npx cdk synth --no-staging > /dev/null
        env:
          AWS_DEFAULT_REGION: us-east-1
          AWS_ACCESS_KEY_ID: testing
          AWS_SECRET_ACCESS_KEY: testing
